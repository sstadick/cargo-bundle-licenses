name: Check

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.88 (${{ matrix.lockfile }} lockfile)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lockfile: [committed, fresh]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install minimum supported toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: '1.88.0'
          override: true

      - name: Resolve fresh dependencies
        if: matrix.lockfile == 'fresh'
        run: |
          rm Cargo.lock
          cargo generate-lockfile

      - name: Test default features
        run: cargo test --locked

      - name: Test library without default features
        run: cargo test --locked --no-default-features

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v1

      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v1

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v1

      - name: Run tests
        run: cargo test --verbose

      - name: Install self
        run: cargo install --path .
      
      - name: Check self license
        run: cargo bundle-licenses --format yaml --output CI.THIRDPARTY.yml --previous THIRDPARTY.yml --check-previous
